*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:'Baloo 2',system-ui,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
.scr.on{display:flex}
button,input,select{font:inherit;color:inherit}
.chip{display:flex;align-items:center;gap:8px;background:var(--g);border:1px solid #ffffff30;border-radius:30px;padding:6px 14px;font-weight:800;font-size:18px;backdrop-filter:blur(8px)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--c)) center/cover;display:grid;place-items:center;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center}
.cn.bump{animation:bp .25s}@keyframes bp{50%{transform:scale(1.5);color:var(--y)}}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:6vh;text-align:center;pointer-events:none}
.logo,.title{font-weight:800;font-size:clamp(34px,9vw,58px);line-height:.95;letter-spacing:1px;text-shadow:0 0 24px var(--p),0 4px 0 #5a0b46}
.logo b,.title b{color:var(--y);text-shadow:0 0 24px var(--y),0 4px 0 #6b4d00}.logo i,.title i{font-style:normal;color:var(--c);text-shadow:0 0 24px var(--c),0 4px 0 #064a57}
#rec{margin-top:10px;background:#0008;border-radius:20px;padding:2px 14px;font-weight:700;color:var(--c)}
.bot{display:flex;flex-direction:column;gap:14px;align-items:center}
.btn{border:0;cursor:pointer;font-weight:800;border-radius:20px;background:linear-gradient(180deg,#ffe86b,#ffa400);color:#4a2600;box-shadow:0 6px 0 #a35c00,0 0 30px #ffb30088;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a35c00}
.play{font-size:36px;padding:12px 70px;position:relative;overflow:hidden;animation:pl 1.6s infinite}
.play::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:sh 2.4s infinite}
@keyframes pl{50%{transform:scale(1.06)}}@keyframes sh{to{left:130%}}
.row{display:flex;gap:10px;width:100%;max-width:440px}
.b2{flex:1;border:1px solid #ffffff40;border-radius:18px;padding:8px 2px;background:var(--g);backdrop-filter:blur(8px);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1.1;transition:transform .12s,background .2s}
.b2 span{font-size:12px;font-weight:800;letter-spacing:.5px}.b2:active{transform:scale(.92);background:#ff2d9555}
.mini{padding:8px 22px;font-size:20px}
#auth{align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 20%,#0000 0,#0d0a24cc 80%);overflow:auto}
.card{width:100%;max-width:390px;background:var(--g);border:1px solid #ffffff33;border-radius:26px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 0 50px #ff2d9544}
.tabs,.stabs{display:flex;gap:6px;margin-bottom:14px}.tabs button,.stabs button{flex:1;border:0;border-radius:14px;padding:7px 2px;background:#ffffff14;cursor:pointer;font-weight:700;font-size:15px}.tabs .on,.stabs .on{background:linear-gradient(90deg,var(--p),#b517ff)}
.in{width:100%;background:#0006;border:1px solid #ffffff40;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:16px;outline:0;user-select:text}.in:focus{border-color:var(--c);box-shadow:0 0 14px #19e3ff66}
#am{min-height:22px;font-size:14px;margin-bottom:6px;color:var(--y)}
.full{width:100%;font-size:22px;padding:8px}
#hud{pointer-events:none}.hd{display:flex;justify-content:space-between;align-items:flex-start}
#hm{text-align:center;text-shadow:0 2px 8px #000}#ht{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}#hm small{display:block;font-size:13px;font-weight:700}#hm.fz #ht{color:#ff5470;animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
#pb2{pointer-events:auto;background:#0008;border:1px solid #fff4;border-radius:12px;padding:2px 12px;font-size:20px;margin-top:4px;cursor:pointer}
#toast{position:fixed;top:92px;left:50%;transform:translate(-50%,-20px);background:linear-gradient(90deg,var(--p),#b517ff);padding:6px 18px;border-radius:20px;font-weight:800;opacity:0;transition:.3s;z-index:20;pointer-events:none;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#panel,#over,#pause{background:#0d0a24e6;z-index:10;backdrop-filter:blur(6px)}

#pb{flex:1;overflow:auto;touch-action:pan-y}

.pfv{display:flex;flex-direction:column;align-items:center;gap:10px}.pfv .av{width:96px;height:96px;font-size:40px}

 else if(id==='neon')r={geo:new THREE.TorusGeometry(.35,.1,8,22),mat:new THREE.MeshStandardMaterial({color:0xff2d95,emissive:0xff2d95,emissiveIntensity:1.4})};
 else if(id==='diamante'){const g=new THREE.OctahedronGeometry(.45);g.scale(1,1.4,1);r={geo:g,mat:new THREE.MeshStandardMaterial({color:0x66e7ff,emissive:0x1aa3d9,emissiveIntensity:.9,metalness:.5,roughness:.1,flatShading:true})}}

function coins(x,z,n,f){for(let i=0;i<n;i++){const p=coinProto(D?D.ce:'ouro'),m=new THREE.Mesh(p.geo,p.mat),y=f?f(i,n):.9;m.position.set(x,y,z-i*1.6);S.add(m);K.push({m,z:z-i*1.6,y,x})}}
function spawn(z){const L=[-2,0,2],fr=L[Math.random()*3|0],r0=Math.random();

const PS=[];for(let i=0;i<70;i++){const m=new THREE.Mesh(G(.14,.14,.14),new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true}));m.visible=false;S.add(m);PS.push({m,l:0,v:new THREE.Vector3()})}
function spark(x,y,z,c,n){for(const p of PS){if(n<=0)break;if(p.l<=0){p.l=.6;p.m.visible=true;p.m.material.color.setHex(c);p.m.position.set(x,y,z);p.v.set((Math.random()-.5)*6,Math.random()*5,(Math.random()-.5)*6);n--}}}
function updP(dt,v){for(const p of PS)if(p.l>0){p.l-=dt;p.v.y-=12*dt;p.m.position.addScaledVector(p.v,dt);p.m.position.z+=v*dt;const k=Math.max(p.l/.6,.05);p.m.material.opacity=k;p.m.scale.setScalar(k);if(p.l<=0)p.m.visible=false}}

let AC,lb=0;addEventListener('pointerdown',()=>{try{AC=AC||new AudioContext();AC.resume()}catch(e){}},{once:true});function beep(f,d,tp){if(muted)return;const n=performance.now();if(n-lb<45)return;lb=n;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=tp||'sine';o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
/* ===== Jogo ===== */
const LX=[-2,0,2],P={l:1,x:0,y:0,vy:0,sl:0,jc:0,jb:0,fl:-1};let st='menu',paused=false,nt=0,frz=false,tm=0,dist=0,V=0,run,sp=0,nb=20,shake=0,T=0,last=0,cmb=0;
const CN=$$('.cn'),HM=$('#hm'),HT=$('#ht'),HS=$('#hs');let hd=1;function hudU(){hd=1}
function hudR(){if(hd&&D){hd=0;const t=fmt(D.coins);CN.forEach(e=>{if(e.textContent!==t)e.textContent=t})}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function show(id,on=true){$('#'+id).classList.toggle('on',on)}
function enterMenu(){st='menu';clearInterval(cdI);$('#cd').classList.remove('on');clearW();['auth','hud','over','pause','panel'].forEach(i=>show(i,false));show('menu');ch.g.rotation.set(0,Math.PI,0);ch.g.position.set(0,0,0);
 $('#un').textContent=U.name;const a=$('#av');a.textContent=U.photo?'':U.name[0].toUpperCase();a.style.backgroundImage=U.photo?`url(${U.photo})`:'';$('#rec').textContent='Recorde sem moeda: '+fmtT(D.bestT);hudU()}
function start(){clearW();Object.assign(P,{l:1,x:0,y:0,vy:0,sl:0,jc:0,jb:0,fl:-1});tm=dist=sp=cmb=nt=0;frz=false;nb=20;run={coins:0};paused=false;st='play';ch.g.rotation.set(0,0,0);['menu','over','panel','pause'].forEach(i=>show(i,false));show('hud');hudU();clearInterval(cdI);$('#cd').classList.remove('on');HM.classList.remove('fz');beep(520,.15,'square')}
function input(d){if(st!=='play'||paused)return;
 if(d==='L')P.l=Math.max(0,P.l-1);else if(d==='R')P.l=Math.min(2,P.l+1);
 else if(d==='U'){if(P.y<=.02){P.vy=12;P.sl=0;P.jc=1;beep(440,.12)}else if(P.jc<2){P.vy=10.5;P.jc=2;P.fl=0;spark(P.x,.5,0,0x19e3ff,8);beep(660,.12)}else P.jb=.15}
 else if(d==='D'){if(P.y>.02)P.vy=-18;P.sl=.75;beep(200,.1)}}
addEventListener('keydown',e=>{const k={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',' ':'U',ArrowDown:'D',s:'D'}[e.key];if(k)input(k);if(e.key==='Escape'||e.key==='p')pause(!paused)});
let sx,sy,sf=true;addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select'))return;sx=e.clientX;sy=e.clientY;sf=false});
addEventListener('pointermove',e=>{if(sf||sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>16||Math.abs(dy)>16){input(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy<0?'U':'D'));sf=true}});
addEventListener('pointerup',()=>{sx=null});
let cdI,muted=!!LS.get('sc3d_mute');
function pause(f){if(st!=='play')return;
 if(f){clearInterval(cdI);$('#cd').classList.remove('on');paused=true;$('#ps').innerHTML=`<div>⏱ Sem moeda<em>${fmtT(nt)}</em></div><div>Distância<em>${fmt(dist)} m</em></div><div>Moedas<em>🪙 ${run.coins}</em></div><div>Sobreviveu<em>${mmss(tm)}</em></div>`;$('#sn').textContent=muted?'MUDO':'SOM LIGADO';show('pause')}
 else{show('pause',false);let n=3;const e=$('#cd');e.textContent=n;e.classList.add('on');clearInterval(cdI);cdI=setInterval(()=>{n--;if(n<=0){clearInterval(cdI);e.classList.remove('on');paused=false}else e.textContent=n},700)}}
function die(){st='over';spark(P.x,1,0,0xff3355,30);beep(120,.5,'sawtooth');shake=.6;
 setTimeout(()=>{const m=Math.floor(dist),rec=nt>D.bestT;if(m>D.best)D.best=m;if(rec)D.bestT=nt;D.runs++;D.ttime+=tm;
  checkUnl();save();syncRank();
  $('#ov').innerHTML=`<div style="grid-column:1/3">⏱ Tempo sem moeda<em style="font-size:36px">${fmtT(nt)}</em>${frz?'':'nenhuma moeda pega!'}</div><div>${rec?'🏆 Novo recorde!':'Recorde'}<em>${fmtT(D.bestT)}</em></div><div>Distância<em>${fmt(m)} m</em></div><div>Moedas<em>🪙 ${run.coins}</em></div><div>Sobreviveu<em>${mmss(tm)}</em></div>`;show('hud',false);show('over');hudU()},800)}
function play(dt){
 V=Math.min(14+tm*.22,34);tm+=dt;if(!frz)nt+=dt;dist+=V*dt;scroll(V*dt);
 P.x+=(LX[P.l]-P.x)*Math.min(1,dt*24);
 if(P.y>0||P.vy>0){P.vy-=32*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.jc=0;P.fl=-1;if(P.jb>0){P.vy=12;P.jc=1;P.jb=0}}}
 if(P.sl>0)P.sl-=dt;if(P.jb>0)P.jb-=dt;
 sp-=V*dt;if(sp<=0){spawn(-95);sp=16+Math.random()*10+V*.55}
 if(tm>=nb){nb+=20;D.coins+=5;D.tcoins+=5;run.coins+=5;hudU();toast('⏱ +5 moedas por tempo de jogo!');beep(990,.2,'triangle')}
 const hit=(o)=>Math.abs(o.x-P.x)<.8&&o.z-o.hd<.35&&o.z+o.hd>-.35;
 for(let i=O.length-1;i>=0;i--){const o=O[i];o.z+=(V+o.ex)*dt;o.m.position.z=o.z;if(o.z>12){S.remove(o.m);O.splice(i,1);continue}
  if(st==='play'&&hit(o)&&(o.type==='train'||(o.type==='bar'&&P.y<1)||(o.type==='sign'&&P.sl<=0)))die()}
 for(let i=K.length-1;i>=0;i--){const k=K[i];k.z+=V*dt;k.m.position.z=k.z;k.m.rotation.y+=dt*4;
  if(k.z>8){S.remove(k.m);K.splice(i,1);continue}
  const dx=k.x-P.x,dy=k.y-(P.y+.9),dz=k.z;if(dx*dx+dy*dy+dz*dz<2.3){S.remove(k.m);K.splice(i,1);D.coins++;D.tcoins++;run.coins++;cmb++;if(!frz){frz=true;HM.classList.add('fz');toast('🔒 Cronômetro travado em '+fmtT(nt));shake=.3;beep(300,.25,'square')}spark(k.x,k.y,k.z,0xffd23f,8);beep(800+Math.min(cmb,12)*40,.1,'triangle');hudU();if(CN[1])CN[1].animate([{transform:'scale(1)'},{transform:'scale(1.35)',color:'#ffd23f'},{transform:'scale(1)'}],160)}}
 if(st==='play'){const w=T*V*.55,ap=P.y>.05,sl=P.sl>0,g=ch.g;
 ch.lL.rotation.x=ap?-.6:sl?-1.1:Math.sin(w);ch.lR.rotation.x=ap?.7:sl?-1.1:-Math.sin(w);
 ch.aL.rotation.x=ap?-2.5:sl?-.5:-Math.sin(w)*.9;ch.aR.rotation.x=ap?-2.5:sl?-.5:Math.sin(w)*.9;
 const fl=P.jc===2&&ap&&P.fl>=0&&P.fl<1;
 if(fl){P.fl+=dt*3.2;g.rotation.x=-Math.min(P.fl,1)*Math.PI*2;if(P.fl>=1)g.rotation.x=0}else g.rotation.x+=((sl&&!ap?1.3:0)-g.rotation.x)*Math.min(1,dt*22);
 const rx=g.rotation.x;g.position.set(P.x,P.y+(fl?.9-.9*Math.cos(rx):0)+(ap||sl?0:Math.abs(Math.sin(w))*.08),-.9*Math.sin(rx));
 g.rotation.z=(LX[P.l]-P.x)*-.12;g.rotation.y=(P.x-LX[P.l])*.15}
 {const a=fmtT(nt),b=(frz?'🔒 travado · ':'sem pegar moeda · ')+fmt(dist)+' m';if(a!==HT.textContent)HT.textContent=a;if(b!==HS.textContent)HS.textContent=b}
 Cam.fov=62+(V-14)*.35;Cam.updateProjectionMatrix();Cam.position.set(P.x*.55,3.7+P.y*.3,6.9);Cam.lookAt(P.x*.3,1.4,-6);rim.position.set(P.x,3,3)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000||.016,.05);last=now;T+=dt;
 if(st==='play'&&!paused)play(dt);
 else if(st==='over'){shake=Math.max(0,shake-dt);Cam.position.x+=(Math.random()-.5)*shake*.6;Cam.position.y+=(Math.random()-.5)*shake*.6}
 else if(st==='menu'&&ch){scroll(3*dt);ch.g.rotation.y=Math.PI+Math.sin(T*.8)*.7;ch.g.position.y=Math.sin(T*2)*.03;ch.aL.rotation.x=Math.sin(T*2)*.15;ch.aR.rotation.x=-Math.sin(T*2)*.15;ch.lL.rotation.x=ch.lR.rotation.x=0;
  Cam.fov=50;Cam.updateProjectionMatrix();Cam.position.set(0,1.5,4.6);Cam.lookAt(0,1.1,0);rim.position.set(1.5,2.5,3)}
 updP(dt,st==='play'&&!paused?V:0);hudR();R.render(S,Cam)}
/* ===== Painéis ===== */
let pk='',sub='p';const ico=s=>`<svg viewBox="0 0 60 84" width="56"><circle cx="30" cy="16" r="11" fill="${s.sh}"/><path d="M19 12a11 11 0 0 1 22 0z" fill="${s.hat}"/><rect x="18" y="29" width="24" height="28" rx="6" fill="${s.top}"/><rect x="18" y="57" width="10" height="24" rx="4" fill="${s.bot}"/><rect x="32" y="57" width="10" height="24" rx="4" fill="${s.bot}"/></svg>`;
function render(){const b=$('#pb');
 if(pk==='loja'||pk==='skins'){const buy=pk==='loja';$('#pt').textContent=buy?'Loja':'Equipar';
  const tabs='<div class="stabs">'+[['p','Personagens'],['c','Moedas'],['m','Mapas']].map(a=>`<button data-a="sub:${a[0]}" class="${sub===a[0]?'on':''}">${a[1]}</button>`).join('')+'</div>';
  const items=sub==='p'?SK:sub==='c'?CSK:MP,owned=sub==='p'?D.owned:sub==='c'?D.cs:D.mo,eq=sub==='p'?D.eq:sub==='c'?D.ce:D.me,kd=sub==='p'?'':sub;
  const card=it=>{const o=owned.includes(it.id),e=eq===it.id;
   const btn=o?(e?'<div class="lk">✔ Em uso</div>':`<button class="btn" data-a="eq${kd}:${it.id}">EQUIPAR</button>`):it.u?`<div class="lk">🔒 ${it.u[2]}<br>Grátis jogando</div>`:`<button class="btn" data-a="buy${kd}:${it.id}">🪙 ${fmt(it.p)}</button>`;
   const pv=sub==='p'?ico(it):sub==='c'?`<div class="cv" style="background:${CV[it.id]}"></div>`:`<div class="mv" style="background:linear-gradient(${it.sky.join(',')})"></div>`;
   return`<div class="sk${e?' eqd':''}" style="--rc:${RC[it.r||'Comum']}">${pv}<b>${it.n}${sub==='p'?(it.g==='M'?' ♂':' ♀'):''}</b>${sub==='p'?`<small>${it.r} · ${it.c}</small>`:''}${btn}</div>`};
  b.innerHTML=tabs+'<div class="grid">'+items.filter(it=>buy||owned.includes(it.id)).map(card).join('')+'</div>'}
 else if(pk==='rank'){$('#pt').textContent='Rank global';const row=(i,n,m,me)=>`<div class="rk${me?' me':''}"><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>${esc(n)}</span><em>${fmtT(m||0)}</em></div>`,hh='<p style="margin-bottom:10px;font-size:14px;opacity:.85">Quem ficou mais tempo sem pegar moeda.</p>';
  if(!RK||!uid){b.innerHTML=hh+'<p style="margin-bottom:10px;font-size:13px;opacity:.7">Ranking global indisponível aqui. Mostrando as contas deste aparelho.</p>'+Object.entries(users).map(([k,u])=>[u.name,k===email?D.bestT:(u.data||{}).bestT||0,k===email]).sort((a,c)=>c[1]-a[1]).map((r,i)=>row(i,r[0],r[1],r[2])).join('');return}
  b.innerHTML=hh+'<p style="text-align:center">Carregando…</p>';
  syncRank().then(()=>RK.collection('rank').orderBy('bestT','desc').limit(30).get()).then(sn=>{if(pk!=='rank')return;b.innerHTML=hh+(sn.empty?'<p>Ninguém no ranking ainda. Seja o primeiro!</p>':sn.docs.map((d,i)=>{const x=d.data();return row(i,x.name,x.bestT,d.id===uid)}).join(''))}).catch(()=>{b.innerHTML=hh+'<p>Não foi possível carregar o ranking.</p>'})}
 else if(pk==='perfil'){$('#pt').textContent='Perfil';b.innerHTML=`<div class="pfv"><div class="av" id="pav" style="background-image:${U.photo?`url(${U.photo})`:'none'}">${U.photo?'':U.name[0].toUpperCase()}</div><button class="btn mini" data-a="photo" style="font-size:15px">Trocar foto</button>
  <input class="in" id="nm" maxlength="16" value="${U.name.replace(/"/g,'')}">
  <div class="st"><div>Sem moeda<em>${fmtT(D.bestT)}</em></div><div>Distância máx.<em>${fmt(D.best)} m</em></div><div>Partidas<em>${D.runs}</em></div><div>Moedas coletadas<em>${fmt(D.tcoins)}</em></div><div>Tempo jogado<em>${mmss(D.ttime)}</em></div></div>
  <button class="btn mini" data-a="logout" style="font-size:16px">Sair da conta</button></div>`;$('#nm').onchange=e=>{U.name=e.target.value.trim()||'Jogador';save();$('#un').textContent=U.name}}}
function equip(k,v){if(k==='eq'){D.eq=v;setChar()}else if(k==='eqc')D.ce=v;else{D.me=v;applyMap(v)}save();hudU();render()}
function act(a){const[k,v]=a.split(':');
 if(k==='play'||k==='again')start();else if(k==='menu'||k==='quit')enterMenu();else if(k==='pause')pause(true);else if(k==='resume')pause(false);
 else if(['loja','skins','rank','perfil'].includes(k)){pk=k;render();show('panel')}
 else if(k==='close'){save();show('panel',false);enterMenu()}
 else if(k==='sub'){sub=v;render()}
 else if(k==='snd'){muted=!muted;LS.set('sc3d_mute',muted);$('#sn').textContent=muted?'MUDO':'SOM LIGADO'}
 else if(k==='buy'||k==='buyc'||k==='buym'){const L={buy:SK,buyc:CSK,buym:MP}[k],it=L.find(x=>x.id===v);if(D.coins<it.p)return toast('Moedas insuficientes!');D.coins-=it.p;({buy:D.owned,buyc:D.cs,buym:D.mo}[k]).push(v);equip('eq'+k.slice(3),v);toast('Comprado e equipado!')}
 else if(k==='eq'||k==='eqc'||k==='eqm')equip(k,v)
 else if(k==='photo')$('#fi').click();
 else if(k==='logout'){save();LS.set('sc3d_sess',null);U=D=null;email=null;st='menu';['menu','panel'].forEach(i=>show(i,false));show('auth');authUI()}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)act(a.dataset.a)});
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);U.photo=c.toDataURL('image/jpeg',.8);save();render();enterMenu&&($('#av').style.backgroundImage=`url(${U.photo})`,$('#av').textContent='')};im.src=r.result};r.readAsDataURL(f)};
/* ===== Boot ===== */
authUI();const ss=LS.get('sc3d_sess');
if(ss&&users[ss])login(ss);

})();
